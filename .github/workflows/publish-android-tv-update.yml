name: Publish Android TV update

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android TV build run ID containing the signed APK
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish selected successful build
    runs-on: ubuntu-latest
    steps:
      - name: Validate selected build
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          if ! [[ "$SELECTED_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Enter the numeric run ID from the Android TV build URL."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SELECTED_RUN_ID" > "$RUNNER_TEMP/selected-run.json"
          jq -e '.status == "completed" and .conclusion == "success" and .head_branch == "main" and .name == "Android TV build"' "$RUNNER_TEMP/selected-run.json" >/dev/null
          run_number=$(jq -r '.run_number' "$RUNNER_TEMP/selected-run.json")
          head_sha=$(jq -r '.head_sha' "$RUNNER_TEMP/selected-run.json")
          echo "run_number=$run_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          artifact_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SELECTED_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "bradflix-android-tv-release" and .expired == false)] | length')
          if [ "$artifact_count" -lt 1 ]; then
            echo "That successful run has no signed APK artifact. Configure the signing secrets and choose a run that built the signed APK."
            exit 1
          fi
      - name: Download signed APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$SELECTED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name bradflix-android-tv-release --dir "$RUNNER_TEMP/release"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.${{ steps.selected.outputs.run_number }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $tag already exists."
            exit 1
          fi
          test -s "$RUNNER_TEMP/release/app-release.apk"
          gh release create "$tag" "$RUNNER_TEMP/release/app-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BradFlix 0.1.${{ steps.selected.outputs.run_number }}" \
            --notes "Manually published from successful Android TV build run ${{ inputs.run_id }} at commit ${{ steps.selected.outputs.head_sha }}."
