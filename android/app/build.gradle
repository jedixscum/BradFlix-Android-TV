plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'tv.bradflix.hub'
    compileSdk 35

    defaultConfig {
        applicationId 'tv.bradflix.hub'
        minSdk 23
        targetSdk 28
        versionCode project.findProperty('buildVersionCode')?.toString()?.toInteger() ?: 1
        versionName project.findProperty('buildVersionName')?.toString() ?: '0.1.0'
    }

    signingConfigs {
        release {
            def keyFile = System.getenv('KEYSTORE_FILE')
            if (keyFile != null) {
                storeFile file(keyFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
